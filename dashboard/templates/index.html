<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>RetailStart Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-light">

<div class="container mt-4">

    <h1 class="mb-4">
        RetailStart Analytics
    </h1>

    <div class="row mb-4">

        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5>Total Ventas</h5>
                    <h2 id="ventas"></h2>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5>Clientes</h5>
                    <h2 id="clientes"></h2>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5>Productos</h5>
                    <h2 id="productos"></h2>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card">
                <div class="card-body">
                    <h5>Transacciones</h5>
                    <h2 id="transacciones"></h2>
                </div>
            </div>
        </div>

    </div>

    <div class="row">

        <div class="col-md-6">
            <canvas id="canalChart"></canvas>
        </div>

        <div class="col-md-6">
            <canvas id="categoriaChart"></canvas>
        </div>

    </div>

    <div class="row mt-4">

        <div class="col">
            <canvas id="fechaChart"></canvas>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
